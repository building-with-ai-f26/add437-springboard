<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Springboard</title>
<script src="../analytics.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Share+Tech+Mono&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c; --panel:#141417; --panel2:#1b1b20; --line:#2b2b32; --ink:#efe8db; --muted:#a39c90;
  --accent:#a77bff; --warn:#ffb000; --teal:#35d6c6; --green:#3ddc84; --red:#ff5a4f;
  --brush:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh}
a{color:var(--accent)}
h1,h2,h3,.brand{font-family:Righteous,"DM Sans",sans-serif;font-weight:400;letter-spacing:.02em;margin:0}
.lcd{font-family:"Share Tech Mono",ui-monospace,monospace;letter-spacing:.06em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#14002e}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;font-size:.9rem}
input,select,textarea{background:#0e0e11;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 4px}
.muted{color:var(--muted)} .note{color:var(--muted);font-size:.88rem}
.panel{background:var(--panel);background-image:var(--brush);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative}
.panel::before,.panel::after{content:"";position:absolute;top:8px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#555,#1a1a1a)}
.panel::before{left:8px}.panel::after{right:8px}

/* top bar */
.deck{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:linear-gradient(#18181c,#0f0f12);border-bottom:1px solid var(--line)}
.brand{font-size:1.5rem;display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.burger{background:none;border:1px solid var(--line);border-radius:8px;width:44px;height:40px;display:grid;place-items:center}
.burger span{display:block;width:20px;height:2px;background:var(--ink);box-shadow:0 6px 0 var(--ink),0 -6px 0 var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
.side{position:fixed;top:0;right:0;height:100%;width:min(300px,86vw);background:var(--panel);background-image:var(--brush);border-left:1px solid var(--line);z-index:31;padding:20px;transform:translateX(100%);transition:transform .25s}
.side.open{transform:none}
.side nav a{display:flex;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
.side nav a .led{margin:0}
.side nav a[aria-current]{color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hero h1{font-size:2.4rem}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--panel);background-image:var(--brush);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card .open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:1.25rem}
.vinyl{width:100%;aspect-ratio:1;max-width:170px;align-self:center;border-radius:50%;background:radial-gradient(circle,var(--lbl) 0 17%,#111 17.5% 19%,transparent 19.5%),repeating-radial-gradient(circle,#161616 0 2px,#0b0b0b 2px 4px);box-shadow:0 6px 18px rgba(0,0,0,.6),inset 0 0 0 2px #222;position:relative;transition:transform 1.2s}
.vinyl::after{content:"";position:absolute;inset:48.5%;border-radius:50%;background:var(--bg)}
.card:hover .vinyl{transform:rotate(200deg)}
.newcard{border-style:dashed;display:grid;place-items:center;min-height:260px;color:var(--muted);font-weight:700;background:none}
.cardbar{display:flex;gap:12px;border-top:1px solid var(--line);padding-top:10px}

/* set page */
.back{display:inline-block;margin-bottom:10px;font-size:.9rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;font-weight:700;color:var(--muted)}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
details.info summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.infogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px}

.key{display:inline-block;min-width:42px;text-align:center;padding:2px 8px;border-radius:6px;background:#050505;border:1px solid #333;color:var(--teal);font-family:"Share Tech Mono",monospace;font-size:1rem;text-shadow:0 0 6px rgba(53,214,198,.6);cursor:pointer}
.bpm{font-family:"Share Tech Mono",monospace;color:var(--accent);text-shadow:0 0 6px rgba(167,123,255,.65);cursor:pointer;background:none;border:0;padding:0}
.led{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
.led.green{background:var(--green);box-shadow:0 0 8px var(--green)}
.led.amber{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.led.acc{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.led.red{background:var(--red);box-shadow:0 0 8px var(--red)}
.led.off{background:#333}

ol.play{list-style:none;margin:0;padding:0}
.trk{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.trk .n{font-family:"Share Tech Mono",monospace;font-size:1.3rem;color:var(--muted);text-align:center}
.trk .t{font-weight:700} .trk .a{color:var(--muted);font-size:.9rem}
.trk .meta{display:flex;gap:12px;align-items:center}
.xfer{margin:6px 0 6px 36px;padding:10px 14px;border-left:2px dashed var(--line);font-size:.92rem}
.xfer b{font-weight:700}
.xfer .win{color:var(--muted)}

/* organize */
.org{display:grid;grid-template-columns:280px 1fr 320px;gap:18px;align-items:start}
@media (max-width:1000px){.org{grid-template-columns:1fr}}
.org h2{font-size:1.15rem;margin-bottom:6px}
.orow{display:grid;grid-template-columns:22px 1fr 72px 64px auto;gap:8px;align-items:center;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.orow.drag{opacity:.4} .orow.over{border-color:var(--accent)}
.orow .grip{cursor:grab;color:var(--muted);text-align:center;user-select:none}
.orow input{padding:4px 6px;font-family:"Share Tech Mono",monospace}
.orow .acts{display:flex;gap:2px}
.orow .acts button{background:none;border:1px solid var(--line);border-radius:6px;width:28px;height:28px;padding:0}
.chk{font-size:.75rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none;white-space:nowrap}.chk.ok{color:var(--green);border-color:var(--green)}.chk.mid{color:var(--teal);border-color:var(--teal)}.chk.est{color:var(--warn);border-color:var(--warn)}
.jump{font-size:.82rem;padding:4px 10px 4px 34px}
.jump.bad{color:var(--red)} .jump.ok{color:var(--muted)}
.tool + .tool{margin-top:16px}
.knobs{display:grid;gap:4px}
.sugg{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:4px}
.msg{font-size:.88rem;margin:8px 0 0}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}
.toggle{display:flex;gap:6px;flex-wrap:wrap}

/* popover */
#pop{position:absolute;z-index:40;width:310px;background:#111114;border:1px solid var(--accent);border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.7);font-size:.92rem}
#pop h3{font-size:1.05rem;margin-bottom:6px}
#pop ul{margin:6px 0 0;padding-left:18px}

/* floating wheel */
#fab{position:fixed;right:20px;bottom:20px;z-index:35;width:58px;height:58px;border-radius:50%;border:1px solid var(--accent);background:radial-gradient(circle,#2a2238 0 30%,#111 31% 100%);color:var(--accent);font-size:1.6rem;box-shadow:0 0 14px rgba(167,123,255,.45),0 6px 18px rgba(0,0,0,.6)}
#dock{position:fixed;right:20px;bottom:90px;z-index:35;width:min(330px,calc(100vw - 40px));max-height:calc(100vh - 130px);overflow:auto;background:#111114;border:1px solid var(--accent);border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
#dock .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#dock g.dim{opacity:.18} #dock g.sel circle{stroke:#fff;stroke-width:3}
#dockInfo{font-size:.9rem} #dockInfo ul{margin:6px 0 0;padding-left:18px}
/* learn */
.learn{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:22px;align-items:start}
@media (max-width:820px){.learn{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tiles .panel h3{font-size:1.05rem;margin-bottom:6px}
svg text{font-family:"Share Tech Mono",monospace;font-size:11px;pointer-events:none}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.ohead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;border:1px solid var(--accent);color:var(--ink);font-size:.82rem;background:rgba(167,123,255,.08)}
.chip button{background:none;border:0;color:var(--muted);padding:0 2px;font-size:1rem;line-height:1}
.tagform{display:flex;gap:6px;width:100%;margin-top:4px}.tagform input{padding:4px 8px}
.fader{accent-color:var(--accent);padding:0;border:0;background:none}
.rangeends{display:flex;justify-content:space-between;margin-top:-2px}
label.check{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:.92rem;color:var(--ink)}
label.check input{width:auto}
.chk.warn{background:none;color:var(--warn);border-color:var(--warn);cursor:pointer}
.orow.locked{border-color:var(--accent)}
.sugg .bd{font-size:.72rem;color:var(--muted)}
.vibe{color:var(--accent);text-shadow:0 0 6px rgba(167,123,255,.6)}
#wake{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:45;background:#111114;border:1px solid var(--accent);border-radius:999px;padding:8px 16px;font-size:.9rem;box-shadow:0 6px 18px rgba(0,0,0,.6)}
</style>
</head>
<body>
<header class="deck">
  <a class="brand" href="#/"><span class="dot" aria-hidden="true"></span>Springboard</a>
  <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="side"><span></span></button>
</header>
<div class="scrim" id="scrim" hidden></div>
<aside class="side" id="side" aria-label="Menu" inert>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span class="brand" style="font-size:1.2rem">Menu</span><button class="btn small" id="closeSide">Close</button></div>
  <nav>
    <a href="#/" data-nav="home"><span class="led acc"></span>My sets</a>
    <a href="#/learn" data-nav="learn"><span class="led acc"></span>Learn: keys &amp; BPM</a>
    <a href="#/about" data-nav="about"><span class="led acc"></span>About</a>
  </nav>
</aside>
<div id="wake" hidden role="status"><span class="led acc"></span>Waking up the server… this can take up to a minute.</div>
<main id="main"></main>
<div id="pop" hidden role="dialog"></div>
<button id="fab" hidden aria-label="Show Camelot wheel" aria-expanded="false" aria-controls="dock">◎</button>
<section id="dock" hidden aria-label="Camelot wheel"><div class="dhead"><h3 style="font-size:1.05rem">Camelot wheel</h3><button class="btn small" id="dockClose">Hide</button></div><div id="dockWheel"></div><div id="dockInfo"><p class="note" style="margin:6px 0 0">Tap a key to light up where it can go. It stays open while you organize.</p></div></section>

<script>
// ---------- helpers
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const track=(e,p)=>{try{window.posthog&&posthog.capture&&posthog.capture(e,p||{})}catch(x){}};
const sid=t=>(t.title+"|"+t.artist).toLowerCase();
const MUSICAL={"1A":"A♭ minor","1B":"B major","2A":"E♭ minor","2B":"F♯ major","3A":"B♭ minor","3B":"D♭ major","4A":"F minor","4B":"A♭ major","5A":"C minor","5B":"E♭ major","6A":"G minor","6B":"B♭ major","7A":"D minor","7B":"F major","8A":"A minor","8B":"C major","9A":"E minor","9B":"G major","10A":"B minor","10B":"D major","11A":"F♯ minor","11B":"A major","12A":"D♭ minor","12B":"E major"};
const NOTE={c:0,"c#":1,db:1,d:2,"d#":3,eb:3,e:4,f:5,"f#":6,gb:6,g:7,"g#":8,ab:8,a:9,"a#":10,bb:10,b:11};
const MINOR_NUM=[5,12,7,2,9,4,11,6,1,8,3,10], MAJOR_NUM=[8,3,10,5,12,7,2,9,4,11,6,1];
function parseKey(k){
  k=String(k||"").trim();
  let m=/^(1[0-2]|[1-9])\s*([ab])$/i.exec(k); if(m) return m[1]+m[2].toUpperCase();
  m=/^([a-g])\s*([#♯b♭]?)\s*(m|min|minor|maj|major)?$/i.exec(k.replace(/\s+/g," ")); if(!m) return null;
  const n=NOTE[(m[1]+(m[2]||"").replace("♯","#").replace("♭","b")).toLowerCase()]; if(n===undefined) return null;
  return /^m(in(or)?)?$/i.test(m[3]||"")?MINOR_NUM[n]+"A":MAJOR_NUM[n]+"B";
}
const kn=k=>({n:+k.slice(0,-1),l:k.slice(-1)});
function keyMove(a,b){
  const A=kn(a),B=kn(b),up=(B.n-A.n+12)%12;
  if(A.l===B.l){
    if(up===0) return {s:1,type:"same",label:"Same key"};
    if(up===1) return {s:.9,type:"step",label:"One step up",dir:"lifts the mood"};
    if(up===11) return {s:.9,type:"step",label:"One step down",dir:"relaxes the mood"};
    if(up===2) return {s:.6,type:"boost",label:"Energy boost (+2)"};
    if(up===7) return {s:.55,type:"boost",label:"Energy boost (+7)"};
  } else {
    if(up===0) return {s:.8,type:"mood",label:A.l==="A"?"Mood shift, minor → major":"Mood shift, major → minor"};
    if(up===1||up===11) return {s:.5,type:"diag",label:"Diagonal move"};
  }
  return {s:.1,type:"clash",label:"Key clash"};
}
const RULES={strict:{min:.8,name:"Strict Camelot"},boost:{min:.5,name:"Allow energy jumps"},loose:{min:0,name:"Anything goes"}};
// tempo match, counting half time and double time
function bpmRel(a,b){
  const opts=[[b,""],[b*2,"half"],[b/2,"double"]].map(([v,m])=>({pct:Math.abs(v-a)/a*100,mode:m}));
  return opts.sort((x,y)=>x.pct-y.pct)[0];
}
const mixWin=(bpm,bars)=>Math.round(bars*4*60/bpm);
function transition(p,n,rule){
  const k=keyMove(p.key,n.key), br=bpmRel(p.bpm,n.bpm), pct=br.pct, keyOk=k.s>=RULES[rule||"strict"].min, tempoOk=pct<=6;
  let led=keyOk&&tempoOk?"green":(k.s>=.5&&pct<=8)?"amber":"red", tip, bars;
  const ht=br.mode?` Mix it as ${br.mode} time (${n.bpm} ↔ ${p.bpm}).`:"";
  if(!tempoOk){ tip=`Tempo gap of ${pct.toFixed(1)}% is too big to blend. Loop the outro, then echo out or cut on the last beat of a phrase.`; bars=8; }
  else if(k.type==="same"){ tip="Long blend: overlap the tracks and swap the bass on a downbeat."+ht; bars=32; }
  else if(k.type==="step"){ tip=`Smooth blend; this ${k.dir}. Bring the new track in on a phrase and trade the bass halfway.`+ht; bars=32; }
  else if(k.type==="mood"){ tip="EQ swap: cut the lows on the outgoing track and bring the new one in on a new phrase."+ht; bars=16; }
  else if(k.type==="boost"){ tip="Short, punchy mix on the drop for a lift. Don’t overlap the melodies for long."+ht; bars=16; }
  else if(k.type==="diag"){ tip="Works in a short blend. Keep the overlap brief and lean on drums."+ht; bars=8; }
  else { tip="Keys clash. Avoid overlapping melodies: echo out, use a drum break, or cut."; bars=4; }
  return {k,pct,half:br.mode,led,keyOk,tempoOk,tip,bars,secs:mixWin(p.bpm,bars)};
}
const hueOf=k=>k?`hsl(${(kn(k).n-1)*30} ${kn(k).l==="A"?"70%":"80%"} ${kn(k).l==="A"?"45%":"62%"})`:"#555";

// ---------- vibe scoring (key, tempo, genre, mood/sound, era, energy)
function energyTarget(curve,pos,n){ if(curve==="steady") return 3; if(curve==="wave") return [2,3,4,5,4,3][pos%6]; return 2+3*pos/Math.max(1,n-1); }
const tagsOf=t=>new Set([...(t.moods||[]),...(t.inst||[]),t.vocals||""].filter(Boolean));
function factors(a,b,s,energyGoal){
  const k=keyMove(a.key,b.key).s, p=bpmRel(a.bpm,b.bpm).pct;
  const tempo=p<=3?1:p<=6?.8:p<=10?.4:.1;
  let genre=.5; if(a.sub&&b.sub&&a.sub===b.sub) genre=1; else if(a.genre&&b.genre) genre=a.genre===b.genre?.7:(a.sub&&b.sub&&a.sub.split(" ").some(w=>b.sub.includes(w))?.5:.15);
  const A=tagsOf(a),B=tagsOf(b); let mood=.5; if(A.size&&B.size){ const inter=[...A].filter(x=>B.has(x)).length; mood=inter/new Set([...A,...B]).size; mood=Math.min(1,mood*1.6); }
  const era=a.year&&b.year?Math.max(0,1-Math.abs(a.year-b.year)/20):.5;
  const energy=energyGoal==null?.5:1-Math.abs((b.energy||3)-energyGoal)/4;
  return {key:k,tempo,genre,mood,era,energy};
}
function weights(sh){
  const v=(sh.vibe??60)/100, m=.4+1.2*v;
  const w={key:.25,tempo:.2,genre:.2*m,mood:.2*m,era:(sh.eraLock?.25:.1)*m,energy:.05};
  const tot=Object.values(w).reduce((x,y)=>x+y,0); for(const k in w) w[k]/=tot; return w;
}
function vibeScore(a,b,s,energyGoal){
  const f=factors(a,b,s,energyGoal), w=weights(s.shape); let sc=0; for(const k in w) sc+=w[k]*f[k];
  if(s.shape.vocals&&s.shape.vocals!=="any"&&b.vocals&&b.vocals!==s.shape.vocals) sc*=.6;
  return {score:sc,f};
}
const dots=v=>"●".repeat(v>=.8?3:v>=.5?2:v>=.25?1:0).padEnd(3,"○");
function fitReason(a,b,f,goal){
  const r=[];
  if(f.genre>=1) r.push(`same subgenre (${b.sub})`); else if(f.genre>=.7) r.push(`same genre (${b.genre})`);
  if(a.year&&b.year&&f.era>=.75) r.push(`same era (${b.year} vs ${a.year})`);
  const shared=[...tagsOf(a)].filter(x=>tagsOf(b).has(x)&&x!=="vocal"&&x!=="instrumental"); if(shared.length) r.push(`shared feel: ${shared.slice(0,3).join(", ")}`);
  const km=keyMove(a.key,b.key); if(km.s>=.8) r.push(km.label.toLowerCase());
  const br=bpmRel(a.bpm,b.bpm); if(br.mode) r.push(`${br.mode}-time tempo match`);
  if(goal!=null&&f.energy>=.75) r.push(`energy ${b.energy||3} fits your curve`);
  return r.length?r.slice(0,3).join(" · "):"";
}

// ---------- storage
const STORE="springboard.sets.v1";
function demo(){
  const t=(title,artist,bpm,key,genre,sub,year,energy,moods,inst,vocals)=>({id:uid(),title,artist,bpm,key,genre,sub,year,energy,moods,inst,vocals});
  return [{id:uid(),title:"Rooftop Warm-up",venue:"Sample set",date:"",vibe:"Sunset disco into house",notes:"Made-up demo tracks. Paste your own songs in Organize set.",

async function ai(prompt,image,web){
  const r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,image,web:!!web})});

const low=x=>String(x||"").toLowerCase().trim();
const arr=(x,n)=>(Array.isArray(x)?x:[]).map(low).filter(Boolean).slice(0,n);
function profile(x){ const y=Math.round(+x.year); return {genre:low(x.genre),sub:low(x.subgenre||x.sub),year:y>=1940&&y<=2035?y:undefined,moods:arr(x.moods,4),inst:arr(x.instruments||x.inst,3),vocals:/instr/i.test(x.vocals||"")?"instrumental":/vocal/i.test(x.vocals||"")?"vocal":undefined}; }

  return (x.title&&x.artist&&key&&bpm>=50&&bpm<=200)?{id:uid(),title:String(x.title).trim(),artist:String(x.artist).trim(),bpm,key,energy:Math.min(5,Math.max(1,Math.round(+x.energy)||3)),why:String(x.why||""),...profile(x)}:null;};

function autoTags(s){
  const T=s.tracks, count=a=>{ const m={}; a.forEach(x=>{ if(x) m[x]=(m[x]||0)+1; }); return Object.entries(m).sort((x,y)=>y[1]-x[1]).map(x=>x[0]); };
  const ys=T.map(t=>t.year).filter(Boolean).sort((a,b)=>a-b), out=[];
  if(ys.length){ const y=ys[Math.floor(ys.length/2)], d=y%100-y%10, part=y%10<=3?"early":y%10<=6?"mid":"late"; out.push(`${part}-${String(d).padStart(2,"0")}s`); }
  out.push(...count(T.map(t=>t.sub||t.genre)).slice(0,2), ...count(T.flatMap(t=>t.moods||[])).slice(0,3), ...count(T.flatMap(t=>t.inst||[])).slice(0,2));
  const v=count(T.map(t=>t.vocals)); if(v[0]) out.push(v[0]==="vocal"?"vocals":"instrumental");
  return [...new Set(out)].slice(0,9);
}

    if(k!==undefined){ const v=parseKey(e.target.value); if(v){ snap(s); T[k].key=v; T[k].check="you"; T[k].alts=[]; track("ai_value_edited",{field:"key"}); refresh(); } else e.target.value=T[k].key; } };

function showAlts(s,i,el){

// ---------- auto-order (vibe-aware, respects locks)
function autoOrder(s){
  const T=s.tracks, n=T.length; if(n<3) return;
  const fixed=new Map(); T.forEach((t,i)=>{ if(t.locked||i===0) fixed.set(i,t); });
  const left=T.filter((t,i)=>!fixed.has(i)), out=[];
  for(let pos=0;pos<n;pos++){
    if(fixed.has(pos)){ out.push(fixed.get(pos)); continue; }
    const p=out[pos-1], next=fixed.get(pos+1), goal=energyTarget(s.shape.curve,pos,n), min=RULES[s.shape.rule].min;
    const score=t=>{ let v=vibeScore(p,t,s,goal).score+(keyMove(p.key,t.key).s>=min?.3:0)-(bpmRel(p.bpm,t.bpm).pct>6?.3:0);
      if(next) v+=.5*vibeScore(t,next,s).score; return v; };
    left.sort((a,b)=>score(b)-score(a)); out.push(left.shift());
  }
  s.tracks=out;
}

function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const sc=Math.min(1,1400/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=img.width*sc; c.height=img.height*sc; c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",.85)); };
  img.onerror=rej; img.src=url; }); }
async function addFromShot(s,file){

// ---------- web verification (with disagreements and vibe profile)
async function verify(s,list,label){
  if(!aiOK||!list.length) return;
  let ok=0, changed=0, split=0;
  for(let b=0;b<list.length;b+=6){
    const batch=list.slice(b,b+6);
    msg(`${label} Checking BPM, key, genre and era online… (${Math.min(b+6,list.length)}/${list.length})`);
    try{
      const res=await ai(`Search the web to verify each song's tempo, musical key and style. Prefer music-data sites such as Tunebat, SongBPM, GetSongBPM, Musicstax, Beatport or Discogs.
${batch.map((t,i)=>`${i}. "${t.title}" by ${t.artist} (current guess: ${t.bpm} BPM, ${t.key})`).join("\n")}
Convert keys to Camelot notation (e.g. A minor = 8A). If credible sources disagree on BPM or key, give the value most sources agree on and list the other values in "alternatives". If you can't find the song, set confidence "low" and keep the current guess.
Reply with only a JSON array, one item per song in the same order: {"i": number, "bpm": number, "camelot": string, ${PROFILE_FIELDS}, "source": URL you used, "confidence": "high"|"medium"|"low", "alternatives": [{"bpm": number, "camelot": string, "source": URL}]}.`,null,true);
      res.forEach(r=>{ const t=batch[+r.i]; if(!t) return; const key=parseKey(r.camelot), bpm=Math.round(+r.bpm), p=profile(r);
        for(const f of ["genre","sub","year","vocals"]) if(p[f]) t[f]=p[f];
        if(p.moods.length) t.moods=p.moods; if(p.inst.length) t.inst=p.inst; if(+r.energy) t.energy=Math.min(5,Math.max(1,Math.round(+r.energy)));
        if(r.confidence==="low"||!key||!(bpm>=50&&bpm<=200)){ t.check="unverified"; return; }
        if(key!==t.key||bpm!==t.bpm) changed++;
        t.key=key; t.bpm=bpm; t.check=r.confidence==="high"?"verified":"likely"; t.src=/^https?:\/\//.test(r.source||"")?r.source:"";
        t.alts=(Array.isArray(r.alternatives)?r.alternatives:[]).map(a=>({bpm:Math.round(+a.bpm),key:parseKey(a.camelot),src:/^https?:\/\//.test(a.source||"")?a.source:""})).filter(a=>a.key&&a.bpm>=50&&a.bpm<=200&&(a.key!==key||a.bpm!==bpm)).slice(0,3);
        if(t.alts.length) split++; ok++; });
    }catch(e){ msg("Couldn’t check online: "+e.message,"err"); save(); drawOrder(s); return; }
    save(); if($("#order")) drawOrder(s);
  }
  track("songs_verified",{count:list.length,verified:ok,changed,disagree:split});
  msg(`${label} Checked ${list.length} online: ${ok} confirmed${changed?`, ${changed} corrected`:""}${split?`, ${split} where sources disagree (tap ⚠ to choose)`:""}${list.length-ok?`, ${list.length-ok} not found (marked “estimate”)`:""}.`,"ok");
  const w=$("#tagWrap"); if(w&&!s.tagsEdited){ w.innerHTML=tagBar(s,true); bindTags(s); }
}

// ---------- AI suggestions (next song and bridges), re-ranked by vibe score
function prefsText(s,anchor){
  const sh=s.shape, tags=tagsFor(s), out=[];
  if(tags.length) out.push(`The set's vibe: ${tags.join(", ")}.`);
  out.push(sh.vibe>=75?"Match that vibe closely: same subgenre, era and mood.":sh.vibe>=40?"Stay close to that vibe, with some variety.":"Surprise the DJ: related but less obvious picks are welcome, as long as they mix.");
  if(sh.eraLock&&anchor.year) out.push(`Only songs released between ${anchor.year-6} and ${anchor.year+6}.`);
  if(sh.vocals!=="any") out.push(`Prefer ${sh.vocals==="vocal"?"songs with vocals":"instrumentals"}.`);
  if(sh.genre==="close") out.push("Stay within the set's genres.");
  return out.join(" ");
}
async function candidates(s,anchor,keys,lo,hi,extra){
  const have=new Set([...s.tracks.map(sid),...s.rejected]);
  const list=(await ai(`You help a DJ pick songs. ${extra}
Current track: "${anchor.title}" by ${anchor.artist}, ${anchor.bpm} BPM, Camelot ${anchor.key}, ${anchor.sub||anchor.genre||"unknown genre"}${anchor.year?", "+anchor.year:""}${anchor.moods&&anchor.moods.length?", feels "+anchor.moods.join("/"):""}.
${prefsText(s,anchor)}
Suggest up to 8 real, released songs in Camelot keys [${keys.join(", ")}] at ${lo}-${hi} BPM (half or double time is fine).
Do not suggest any of: ${[...have].join("; ")||"none"}. Only include songs whose key and tempo you know well.
Reply with only a JSON array; each item: ${SONG_SCHEMA.slice(0,-1)}, "why": one short sentence on why it fits the vibe}.`)).map(cleanSong).filter(x=>x&&!have.has(sid(x))&&keys.includes(x.key)&&bpmRel(anchor.bpm,x.bpm).pct<=Math.max(8,(hi-lo)/anchor.bpm*100));
  return list;
}
function renderSugg(s,list,anchor,next,insertAt,label,goal){
  const out=$("#suggOut");
  const ranked=list.map(x=>{ const a=vibeScore(anchor,x,s,goal), b=next?vibeScore(x,next,s):null;
    return {x,score:b?(a.score+b.score)/2:a.score,f:a.f,reason:fitReason(anchor,x,a.f,goal)}; }).sort((a,b)=>b.score-a.score).slice(0,6);
  if(!ranked.length){ out.innerHTML=`<p class="note">No confident matches. Try moving the Vibe fader toward “Surprise me”, or “Allow energy jumps”.</p>`; return; }
  out.innerHTML=`<p class="note" style="margin-top:10px"><b>${esc(label)}</b></p>`+ranked.map((r,n)=>`<div class="sugg"><span><b>${esc(r.x.title)}</b> · ${esc(r.x.artist)}${r.x.year?` · ${r.x.year}`:""}</span>
    <span>${bpmBtn(r.x.bpm)} ${keyBtn(r.x.key)} <span class="note">${esc(r.x.sub||r.x.genre)}</span> <span class="lcd vibe">${Math.round(r.score*100)}%</span></span>
    <span class="bd lcd" aria-label="Fit breakdown">KEY ${dots(r.f.key)} · TEMPO ${dots(r.f.tempo)} · GENRE ${dots(r.f.genre)} · ERA ${dots(r.f.era)} · MOOD ${dots(r.f.mood)}</span>
    ${r.reason?`<span class="note">${esc(r.reason)}</span>`:""}${r.x.why?`<span class="note">${esc(r.x.why)}</span>`:""}
    <span class="toggle"><button class="btn small" data-addsugg="${n}">${next?"Insert here":"Add after #"+(insertAt)}</button><button class="link" data-rej="${n}">Not for me</button></span></div>`).join("");
  out.onclick=e=>{ const a=e.target.closest("[data-addsugg]"), r=e.target.closest("[data-rej]");
    if(a){ const x=ranked[+a.dataset.addsugg].x; snap(s); x.fromAI=true; x.check=x.check||"unverified"; s.tracks.splice(insertAt,0,x); save(); track("ai_song_added",{bridge:!!next}); a.parentElement.innerHTML=`<span class="note">Added ✓</span>`; drawOrder(s); insertAt++; }
    if(r){ const x=ranked[+r.dataset.rej].x; s.rejected=[...new Set([...s.rejected,sid(x)])]; save(); track("ai_song_rejected"); r.closest(".sugg").remove(); } };
}
async function runSugg(btn,fn){
  const out=$("#suggOut"); btn&&(btn.disabled=true); const old=btn&&btn.textContent; if(btn) btn.textContent="Thinking…";
  out.innerHTML=`<p class="note">This can take up to a minute.</p>`;
  try{ await fn(); }catch(e){ out.innerHTML=`<p class="msg err">Couldn’t reach the AI: ${esc(e.message)}</p>`; }

}
function suggestAfter(s,i){
  const t=s.tracks[i]; if(!t) return; track("ai_suggest_clicked");
  const min=Math.max(RULES[s.shape.rule].min,.5), keys=Object.keys(MUSICAL).filter(k=>keyMove(t.key,k).s>=min), goal=energyTarget(s.shape.curve,i+1,Math.max(s.tracks.length,i+2));
  runSugg($("#suggest"),async()=>{ const list=await candidates(s,t,keys,Math.round(t.bpm*.94),Math.round(t.bpm*1.06),`Energy around ${Math.round(goal)}/5.`);

}
function bridge(s,i){
  const a=s.tracks[i-1], b=s.tracks[i]; if(!a||!b) return;
  if(!aiOK) return alert(aiWhy);

  runSugg(null,async()=>{ const list=await candidates(s,a,keys,lo,hi,`Find a bridge track to play between "${a.title}" (${a.bpm} BPM, ${a.key}) and "${b.title}" (${b.bpm} BPM, ${b.key}); it must mix well out of the first and into the second.`);
    track("ai_tracks_found",{count:list.length,bridge:true}); renderSugg(s,list,a,b,i,`Bridges from “${a.title}” to “${b.title}”`,null); });
}

function wheel(){
  let g=""; [["B",118],["A",78]].forEach(([l,r])=>{ for(let n=1;n<=12;n++){ const a=((n-1)*30-90)*Math.PI/180, x=150+r*Math.cos(a), y=150+r*Math.sin(a), k=n+l;
    g+=`<g data-keyhelp="${k}" style="cursor:pointer" role="button" tabindex="0" aria-label="${k}, ${MUSICAL[k]}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="18" fill="${hueOf(k)}" stroke="#000" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" fill="#000">${k}</text></g>`; }});
  return `<svg viewBox="0 0 300 300" role="img" aria-label="Camelot wheel. Tap a key for details."><circle cx="150" cy="150" r="145" fill="#0d0d0f" stroke="#2b2b32"/>${g}<circle cx="150" cy="150" r="44" fill="#111" stroke="#2b2b32"/><text x="150" y="146" text-anchor="middle" fill="#a77bff">CAMELOT</text><text x="150" y="162" text-anchor="middle" fill="#a39c90">A inner · B outer</text></svg>`;
}
